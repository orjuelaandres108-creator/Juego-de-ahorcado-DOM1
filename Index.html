<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Ahorcado</title>
</head>
<body>

  <h1>Juego del Ahorcado</h1>

  <!-- 1. Muestra los intentos o errores -->
  <p id="intentos">Intentos restantes: <span id="contador">6</span></p>

  <!-- 2. Espacio donde se mostrará la palabra (ej: _ _ _ _) -->
  <div id="palabra-secreta"></div>

  <!-- 3. Contenedor para generar los botones de las letras -->
  <div id="teclado"></div>

  <!-- 4. Mensaje final de victoria o derrota -->
  <p id="mensaje"></p>

  <!-- 5. Botón para reiniciar la partida -->
  <button id="btn-reiniciar">Reiniciar juego</button>

  <!-- Vinculación del archivo JS que crearemos después -->
  <script src="script.js"></script>
</body>
</html>
